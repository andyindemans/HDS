{% extends 'base.html' %}
{% block content %}
<div class="photos-container">
    <div class="upload-section">
        <h1>Photo Album</h1>
        <form method="POST" enctype="multipart/form-data" class="upload-form">
            <div class="file-input-wrapper">
                <input type="file" name="photos" multiple id="fileInput" class="file-input">
                <label for="fileInput" class="file-label">
                    <span class="browse-text">Choose Files</span>
                    <span class="file-details">or drag and drop</span>
                </label>
            </div>
            <div class="preview-carousel" id="previewCarousel"></div>
            <button type="submit" class="submit-button upload-button">
                Upload Selected Files
            </button>
        </form>
    </div>

    <div class="photo-album" id="photoGrid">
        {% for photo in photos %}
        <div class="photo-item" onclick="openLightbox('{{ url_for('uploaded_file', filename=photo) }}')">
            <img 
                src="{{ url_for('uploaded_file', filename=photo) }}" 
                alt="Uploaded photo"
                loading="lazy"
            >
        </div>
        {% endfor %}
    </div>

    <!-- Lightbox Overlay -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox(event)">
        <span class="close-btn" onclick="closeLightbox(event)">&times;</span>
        <img class="lightbox-content" id="lightbox-img">
    </div>
</div>
</div>

<style>
.photos-container {
    max-width: 1200px;
    margin: 2rem auto;
    padding: 0 1.5rem;
}

.upload-section {
    background: #fff;
    border-radius: 12px;
    padding: 2rem;
    box-shadow: 0 2px 16px rgba(0, 0, 0, 0.1);
    margin-bottom: 2rem;
}

.file-input-wrapper {
    margin: 1rem 0 2rem;
}

.file-input {
    opacity: 0;
    position: absolute;
    z-index: -1;
}

.file-label {
    display: block;
    text-align: center;
    padding: 2rem;
    border: 2px dashed #ddd;
    border-radius: 8px;
    cursor: pointer;
    transition: border-color 0.2s ease;
}

.file-label:hover {
    border-color: #0070f3;
}

.browse-text {
    display: block;
    color: #0070f3;
    font-weight: 600;
    margin-bottom: 0.5rem;
}

.file-details {
    color: #666;
    font-size: 0.9rem;
}

.preview-carousel {
    display: grid;
    grid-auto-flow: column;
    gap: 1rem;
    overflow-x: auto;
    padding: 1rem 0;
    scroll-snap-type: x mandatory;
}

.preview-carousel::-webkit-scrollbar {
    height: 8px;
}

.preview-carousel::-webkit-scrollbar-track {
    background: #f1f1f1;
    border-radius: 4px;
}

.preview-carousel::-webkit-scrollbar-thumb {
    background: #ddd;
    border-radius: 4px;
}

.preview-item {
    scroll-snap-align: start;
    width: 200px;
    height: 112px;
    border-radius: 8px;
    overflow: hidden;
    position: relative;
    background: #f8f9fa;
}

.preview-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.photo-album {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 1rem;
    margin-top: 2rem;
}

.photo-item {
    aspect-ratio: 1;
    border-radius: 8px;
    overflow: hidden;
    background: #f8f9fa;
}

.photo-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.2s ease;
}

.photo-item:hover img {
    transform: scale(1.05);
}

.upload-button {
    margin-top: 1.5rem;
    width: auto;
    padding: 12px 24px;
}

/* Infinite Scroll Loading Indicator */
.loading-indicator {
    text-align: center;
    padding: 2rem;
    color: #666;
    display: none;
}

@media (max-width: 768px) {
    .photos-container {
        padding: 0 1rem;
    }
    
    .upload-section {
        padding: 1.5rem;
    }
    
    .preview-item {
        width: 160px;
        height: 90px;
    }
}

.lightbox {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.9);
    overflow: auto;
}

.lightbox-content {
    margin: auto;
    display: block;
    width: auto;
    height: auto;
    max-width: 90%;
    max-height: 90%;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

.close-btn {
    position: absolute;
    top: 20px;
    right: 35px;
    color: white;
    font-size: 40px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.close-btn:hover {
    color: #bbb;
}

.photo-item {
    cursor: pointer;
    transition: transform 0.2s ease;
}

.photo-item:hover {
    transform: scale(1.03);
}
</style>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const fileInput = document.getElementById('fileInput');
    const previewCarousel = document.getElementById('previewCarousel');
    
    // File preview handler
    fileInput.addEventListener('change', function(e) {
        previewCarousel.innerHTML = '';
        Array.from(this.files).forEach(file => {
            const reader = new FileReader();
            reader.onload = (event) => {
                const previewItem = document.createElement('div');
                previewItem.className = 'preview-item';
                previewItem.innerHTML = `<img src="${event.target.result}" alt="Preview">`;
                previewCarousel.appendChild(previewItem);
            };
            reader.readAsDataURL(file);
        });
    });

    // Infinite scroll handler
    const photoGrid = document.getElementById('photoGrid');
    const loadingIndicator = document.createElement('div');
    loadingIndicator.className = 'loading-indicator';
    loadingIndicator.textContent = 'Loading more photos...';
    document.body.appendChild(loadingIndicator);

    let loading = false;
    let page = 1;

    async function loadMorePhotos() {
        if (loading) return;
        loading = true;
        loadingIndicator.style.display = 'block';
        
        try {
            const response = await fetch(`/photos?page=${++page}`);
            const html = await response.text();
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            const newItems = doc.querySelectorAll('.photo-item');
            newItems.forEach(item => photoGrid.appendChild(item));
        } catch (error) {
            console.error('Error loading photos:', error);
        }
        
        loading = false;
        loadingIndicator.style.display = 'none';
    }

    window.addEventListener('scroll', () => {
        const { scrollTop, scrollHeight, clientHeight } = document.documentElement;
        if (scrollTop + clientHeight >= scrollHeight - 500) {
            loadMorePhotos();
        }
    });
});

function openLightbox(imgSrc) {
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    lightbox.style.display = 'block';
    lightboxImg.src = imgSrc;
    document.body.style.overflow = 'hidden'; // Prevent background scrolling
}

function closeLightbox(event) {
    // Only close if clicking directly on overlay or close button
    if (event.target.classList.contains('lightbox') || 
        event.target.classList.contains('close-btn')) {
        document.getElementById('lightbox').style.display = 'none';
        document.body.style.overflow = 'auto'; // Restore scrolling
    }
}

// Close with ESC key
document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
        document.getElementById('lightbox').style.display = 'none';
        document.body.style.overflow = 'auto';
    }
});
</script>
{% endblock %}
